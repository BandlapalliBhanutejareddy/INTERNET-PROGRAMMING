<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 05 - DOM Manipulation & Dynamic Filtering</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .container { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        .controls { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        input { flex: 1; padding: 0.65rem 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #ffffff; }
        .btn { background: #2563eb; color: #ffffff; border: none; padding: 0.65rem 1.25rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #0f172a; border: 1px solid #334155; padding: 1rem; margin-bottom: 0.75rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .del-btn { background: #ef4444; color: #fff; border: none; padding: 0.35rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .count-badge { font-size: 0.9rem; color: #94a3b8; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Dynamic Book Catalog Manager</h2>
        <div class="count-badge" id="countBadge">Total Books: 3</div>

        <!-- Add Book Input -->
        <div class="controls">
            <input type="text" id="newBookInput" placeholder="Enter book title...">
            <button class="btn" id="addBookBtn">&#43; Add Book</button>
        </div>

        <!-- Live Search Input -->
        <div class="controls">
            <input type="text" id="filterInput" placeholder="Type to filter catalog in real time...">
        </div>

        <ul id="bookList">
            <li>
                <span>Internet & World Wide Web How to Program</span>
                <button class="del-btn" onclick="removeBook(this)">&times; Delete</button>
            </li>
            <li>
                <span>Web Technologies: Computer Science Perspective</span>
                <button class="del-btn" onclick="removeBook(this)">&times; Delete</button>
            </li>
            <li>
                <span>Introduction to Algorithms (CLRS)</span>
                <button class="del-btn" onclick="removeBook(this)">&times; Delete</button>
            </li>
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
