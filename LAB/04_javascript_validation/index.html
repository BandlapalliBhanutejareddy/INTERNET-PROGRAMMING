<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 04 - JavaScript Form Validation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .card { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.4rem; }
        input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #ffffff; box-sizing: border-box; }
        input:focus { outline: none; border-color: #2563eb; }
        .error { color: #ef4444; font-size: 0.78rem; display: block; margin-top: 0.25rem; }
        .success { color: #10b981; font-size: 0.78rem; display: block; margin-top: 0.25rem; }
        .btn { width: 100%; background: #2563eb; color: #ffffff; padding: 0.75rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
        .btn:hover { background: #1d4ed8; }
        #formSuccessMessage { display: none; background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; color: #d1fae5; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Student Registration Validation</h2>
        <div id="formSuccessMessage">&#10004; Validation Successful! Form submitted.</div>

        <form id="studentForm" novalidate>
            <div class="form-group">
                <label for="studentId">Student Registration ID</label>
                <input type="text" id="studentId" placeholder="e.g. 192325016">
                <span class="error" id="idError"></span>
            </div>

            <div class="form-group">
                <label for="studentName">Full Name</label>
                <input type="text" id="studentName" placeholder="e.g. Bhanuteja Reddy">
                <span class="error" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="studentEmail">Email Address</label>
                <input type="email" id="studentEmail" placeholder="student@college.edu">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="studentPassword">Password (Min. 8 chars, 1 uppercase, 1 digit)</label>
                <input type="password" id="studentPassword" placeholder="Enter secure password">
                <span class="error" id="passwordError"></span>
            </div>

            <button type="submit" class="btn">Validate & Register</button>
        </form>
    </div>

    <script src="validation.js"></script>
</body>
</html>
