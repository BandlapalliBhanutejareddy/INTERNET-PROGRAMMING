<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment 16 - AJAX Live Book Search</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 2rem; }
        .card { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 8px; border: 1px solid #334155; }
        input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 1rem; }
        #results { margin-top: 1.5rem; }
        .item { background: #0f172a; border: 1px solid #334155; padding: 0.75rem 1rem; margin-bottom: 0.5rem; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #10b981; color: #fff; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AJAX Live Catalog Search</h2>
        <input type="text" id="ajaxSearch" placeholder="Type book title, author, or ISBN...">
        <div id="results"></div>
    </div>

    <script>
        const input = document.getElementById('ajaxSearch');
        const results = document.getElementById('results');

        input.addEventListener('input', async () => {
            const q = input.value.trim();
            if (q.length < 2) {
                results.innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`../../books/search_ajax.php?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                results.innerHTML = '';

                if (data.length === 0) {
                    results.innerHTML = '<p style="color: #94a3b8;">No matching books found.</p>';
                    return;
                }

                data.forEach(book => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <div>
                            <strong>${book.title}</strong>
                            <div style="font-size: 0.8rem; color: #94a3b8;">By ${book.author} &bull; ${book.isbn}</div>
                        </div>
                        <span class="badge">${book.available_copies} Available</span>
                    `;
                    results.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
