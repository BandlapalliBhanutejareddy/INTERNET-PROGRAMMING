<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            height: 300px;
            background: lightgray;
        }

        .box {
            background: skyblue;
            padding: 30px;
            width: 100px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h2 align="center">Flexbox Layout</h2>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>
</html>
